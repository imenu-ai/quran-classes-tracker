# The teacher's day, like the web's main-flow spec: a class, a student,
# attendance, a recitation with a half mark, next-day homework as a page, and
# the month table, all synced.
appId: ai.imenu.quran
name: Main flow
env:
  CODE: "200001"
  USERNAME: m_main
---
- runFlow: subflows/open-app.yaml
- runFlow: subflows/sign-in.yaml
- extendedWaitUntil:
    visible: متصل
    timeout: 30000

# A class (the create sheet), then its page.
- tapOn: إنشاء حلقة
- tapOn:
    id: class.name
- inputText: Fajr
- hideKeyboard
- tapOn:
    text: إنشاء حلقة
    index: 1
- extendedWaitUntil:
    visible: لا يوجد طلاب في هذه الحلقة
    timeout: 10000

# A student.
- tapOn: إضافة طالب
- tapOn:
    id: student.name
- inputText: Omar Ali
- tapOn:
    id: student.birth-year
- inputText: "2015"
- hideKeyboard
- scrollUntilVisible:
    element: إضافة طالب
    direction: DOWN
- tapOn: إضافة طالب
- extendedWaitUntil:
    visible: Omar Ali
    timeout: 10000

# Today: present, then a portion recited on the spot.
- tapOn: Omar Ali
- tapOn: حاضر
- tapOn: تسميع الآن
- tapOn: "السورة: اختر السورة"
- inputText: "78"
- tapOn: 78 · النبأ · 40 آية
- tapOn:
    id: ayah.from
- inputText: "1"
- tapOn:
    id: ayah.to
- inputText: "5"
- hideKeyboard
- tapOn: حفظ

# The recited item opens by itself; the memorization mark from its picker.
- extendedWaitUntil:
    visible: النبأ 1–5
    timeout: 10000
- scrollUntilVisible:
    element:
      id: score.memorization
    direction: DOWN
- tapOn:
    id: score.memorization
# A half mark the dropdown shows without scrolling (it starts at 0, 0.5, 1 …).
- tapOn: '2\.5'
- extendedWaitUntil:
    visible: 2\.5 · —
    timeout: 10000

# Next-day homework as a whole page: page 604 holds the last three suras.
- scrollUntilVisible:
    element: إضافة واجب لليوم التالي
    direction: DOWN
- tapOn: إضافة واجب لليوم التالي
- tapOn: صفحات
- tapOn:
    id: page.from
- inputText: "604"
- tapOn:
    id: page.to
- inputText: "604"
- hideKeyboard
- assertVisible: .*الإخلاص كاملة، الفلق كاملة، الناس كاملة.*
- tapOn: حفظ
- extendedWaitUntil:
    visible: ص 604 · .*
    timeout: 10000

# The month table shows the day. Its heading is the month, whichever it is
# ("نوفمبر 2026"); a date elsewhere on the page has more words.
- scrollUntilVisible:
    element: "[^ ]+ 20[0-9][0-9]"
    direction: UP
- tapOn: "[^ ]+ 20[0-9][0-9]"
- assertVisible: '2\.5'

# Everything reached the server: the sync section says so.
- tapOn: الإعدادات
- extendedWaitUntil:
    visible: متصل
    timeout: 30000
