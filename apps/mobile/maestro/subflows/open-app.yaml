# A fresh start: no data, no session. The development build loads its
# JavaScript from Metro (METRO_URL, e.g. http://localhost:8082); the runner
# (scripts/e2e.mts) passes it.
appId: ai.imenu.quran
---
- stopApp
- clearState
# The link starts the app on the bundle: opened right after launchApp, the
# development client's launcher swallowed it.
# disableOnboarding skips the development client's greeting, which a slow
# first bundle brought up over the sign-in screen after the checks below.
- openLink: ai.imenu.quran://expo-development-client/?url=${METRO_URL}&disableOnboarding=1
# The development client's menu can still come up over the app once it has
# loaded: wait for the app or the menu, then close the menu.
- extendedWaitUntil:
    visible: تسجيل الدخول|Continue|Close
    timeout: 120000
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: تسجيل الدخول
    timeout: 30000
