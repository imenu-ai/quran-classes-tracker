# AWS Amplify Hosting build for the Next.js SSR app (see README → Deployment).
# Not used yet: prepared for the first deployment.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node version from .nvmrc (22).
        - nvm install
        - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        - corepack enable
        - pnpm config set store-dir .pnpm-store
        # A flat node_modules: Amplify's SSR packaging copies traced files and
        # can miss packages behind pnpm's symlinks.
        - pnpm install --frozen-lockfile --config.node-linker=hoisted
    build:
      commands:
        # Amplify doesn't pass environment variables to the SSR runtime, so
        # write the server ones into .env.production before building.
        - env | grep -E '^(MONGODB_URI|MONGODB_DB|BETTER_AUTH_SECRET|BETTER_AUTH_URL|ENABLED_LOCALES)=' >> .env.production
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .pnpm-store/**/*
      - .next/cache/**/*
