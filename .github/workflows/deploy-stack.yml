name: Deploy stack

# Deploys the Amplify CloudFormation stack (infra/amplify-stack.yml) when it
# changes on main. It doesn't build the app: Amplify builds main by itself.
on:
  push:
    branches: [main]
    paths:
      - infra/amplify-stack.yml
      - .github/workflows/deploy-stack.yml
  workflow_dispatch:

concurrency:
  group: deploy-stack
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  STACK_NAME: quran-classes-tracker-amplify

jobs:
  deploy:
    name: Deploy the Amplify stack
    # The deploy role trusts only this environment on main
    # (infra/github-deploy-role.yml).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Prints the claims the deploy role's trust policy checks (never the
      # token itself), to compare when AWS refuses the role.
      - name: Show OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
            const { sub, aud, ref, environment, repository } = claims;
            core.info(JSON.stringify({ sub, aud, ref, environment, repository }, null, 2));

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          APP_SECRET_ARN: ${{ secrets.APP_SECRET_ARN }}
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/amplify-stack.yml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "GitHubAccessToken=$GITHUB_ACCESS_TOKEN" \
              "AppSecretArn=$APP_SECRET_ARN"

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --output table
